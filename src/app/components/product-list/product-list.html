
<h2 class="heaadi">Our Products</h2>


<p class="pro">Products count: {{ products.length }}</p>
<h2>My Cart ({{ cart.length }})</h2>
<p *ngIf="errorMessage">{{ errorMessage }}</p>

<p *ngIf="loading">Loading products...</p>

<div class="products">
  <div class="product-card" *ngFor="let product of products">
    <img [src]="product.thumbnail" [alt]="product.title">
    <h3>{{ product.title }}</h3>
    <p>{{ product.description }}</p>
    <h4>INR {{ product.price }}</h4>
  <div class="cart-controls">
  <button
    class="plus"
    (click)="RemoveToCart(product)">−</button>

  <span>{{ getQuantity(product) }}</span>

  <button
    class="plus"
    (click)="addToCart(product)">+</button>
</div>

<button (click)="addToCart(product)">
  Add to Cart
</button>
  </div>
</div>
